name: Yanfaa Wazuh Deployment - CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  id-token: write # Required for requesting the OIDC JWT Token
  contents: read  # Required for actions/checkout

jobs:
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate YAML Syntax
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable, empty-lines: disable}}" single-node/docker-compose.yml .github/workflows/ci-cd.yml

      - name: Validate Docker Compose Configuration
        run: |
          cd single-node
          INDEXER_USERNAME=dummy INDEXER_PASSWORD=dummy API_USERNAME=dummy API_PASSWORD=dummy DASHBOARD_USERNAME=dummy DASHBOARD_PASSWORD=dummy docker compose config --quiet

  deploy-production-ssm:
    name: Deploy to Production via SSM
    needs: validate-config
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1
          role-skip-session-tagging: true

      - name: Execute Deployment
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.PRODUCTION_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["su - yanfaa -c \"bash /home/yanfaa/wazuh-docker/scripts/deploy.sh\""]}' \
            --comment "Deploying master branch to Wazuh Server" \
            --timeout-seconds 5400 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll every 5 s — up to 90 min — matching --timeout-seconds above.
          # send-command returns immediately on delivery; we must poll for the
          # actual exit status so a failed deploy fails this GitHub job.
          for i in $(seq 1 1080); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.PRODUCTION_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/1080] $STATUS"
            case "$STATUS" in
              Success)
                echo "✓ Production deployment succeeded"
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "✗ Production deployment failed: $STATUS"
                echo "--- SERVER ERROR LOGS ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.PRODUCTION_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text
                echo "--- SERVER OUTPUT LOGS ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.PRODUCTION_INSTANCE_ID }}" \
                  --query "StandardOutputContent" --output text
                echo "--------------------------"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "✗ Timed out waiting for production deployment (90 min)"
          exit 1
